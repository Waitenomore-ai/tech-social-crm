name: Calendar layout fix

on:
  push:
    paths:
      - '.calendar-layout-fix-trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append calendar layout CSS
        run: |
          cat >> styles.css <<'EOF'

/* Calendar filter row fix: keep every filter/dropdown beside the others. */
.calendar-shell .calendar-filters,
.calendar-shell .calendar-filter-row,
.calendar-shell .calendar-controls,
.calendar-shell .calendar-toolbar-filters {
  display: flex !important;
  flex-direction: row !important;
  align-items: center !important;
  flex-wrap: nowrap !important;
  gap: 14px !important;
  width: 100% !important;
}
.calendar-shell .calendar-filters > *,
.calendar-shell .calendar-filter-row > *,
.calendar-shell .calendar-controls > *,
.calendar-shell .calendar-toolbar-filters > * {
  flex: 0 1 240px !important;
  min-width: 0 !important;
}
.calendar-shell select {
  min-width: 190px !important;
}
@media (max-width: 1050px) {
  .calendar-shell .calendar-filters,
  .calendar-shell .calendar-filter-row,
  .calendar-shell .calendar-controls,
  .calendar-shell .calendar-toolbar-filters {
    overflow-x: auto !important;
    flex-wrap: nowrap !important;
  }
}
EOF
          rm -f .calendar-layout-fix-trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add styles.css .calendar-layout-fix-trigger
          git commit -m "Fix calendar filters to one horizontal row"
          git push
